services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geotech-postgres
    environment:
      POSTGRES_USER: geotech
      POSTGRES_PASSWORD: geotech
      POSTGRES_DB: geotech
    ports:
      - "5432:5432"
    volumes:
      - geotech-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotech"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: geotech-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: geotech
      MINIO_ROOT_PASSWORD: geotech123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - geotech-minio:/data

volumes:
  geotech-pgdata:
  geotech-minio:
